<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="WebDrift: websites, business systems and AI assistants">
  <defs>
    <radialGradient id="orb" cx="40%" cy="38%" r="65%">
      <stop offset="0" stop-color="#bfe3ff"/><stop offset="0.35" stop-color="#3d8bff"/><stop offset="0.75" stop-color="#1240c8"/><stop offset="1" stop-color="#06134a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3d8bff" stop-opacity="0.45"/><stop offset="1" stop-color="#3d8bff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
  </defs>
  <rect width="1200" height="300" fill="#07080b"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <circle cx="1000" cy="150" r="150" fill="url(#glow)"/>
  <circle cx="1000" cy="150" r="78" fill="url(#orb)">
    <animate attributeName="r" values="76;82;76" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g fill="#fff" stroke="none" opacity="0.7"><circle cx="160" cy="60" r="1.2"/><circle cx="420" cy="250" r="1"/><circle cx="760" cy="40" r="1.4"/><circle cx="880" cy="270" r="1"/><circle cx="600" cy="90" r="0.9"/></g>
  <text x="80" y="140" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">WebDrift</text>
  <text x="82" y="188" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" fill="#c9ced8">Websites · Business systems · AI assistants</text>
  <text x="82" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#7d8594">Dresden, Germany · remote across Europe · DE / EN</text>
</svg>
